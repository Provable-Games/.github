name: Code Review (reusable)

# Reusable AI code-review workflow for Provable-Games repos.
#
# Callers supply only repo-specific data:
#   - .github/review-agents.json  — agents: which diff paths to review, the
#                                    prompt file, and a display name.
#   - .github/prompts/*.md         — the review criteria each agent uses.
# Everything generic (matrix build, prompt assembly, the codex sandbox
# workaround, comment publishing, claude transcript extraction) lives here.
# Reviewer settings are pinned here so org/repo variables cannot override them:
#   Claude: claude-opus-5-5, medium (Claude Code CLI 2.1.281)
#   Codex:  gpt-6-luna, max (@openai/codex 0.155.0)
#
# Usage from a caller repo (.github/workflows/pr-review.yml):
#   jobs:
#     review:
#       uses: Provable-Games/.github/.github/workflows/code-review.yml@v1
#       secrets: inherit
#
# Remaining optional Org variable:
#   CODEX_REVIEW_TIMEOUT_SECONDS

on:
  workflow_call:
    inputs:
      config_path:
        description: Path to the review-agents config in the caller repo.
        type: string
        default: .github/review-agents.json
      enable_claude:
        description: Run the Claude reviewer.
        type: boolean
        default: true
      enable_codex:
        description: Run the Codex reviewer.
        type: boolean
        default: true
      block_on_severity:
        description: >-
          Fail the review job when a reviewer reports a [CRITICAL] or [HIGH]
          finding, turning review into a merge gate. Off by default: reviews
          are advisory unless a repo opts in.
        type: boolean
        default: false
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: false
      CODEX_AUTH_DOT_JSON:
        required: false

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      has-reviews: ${{ steps.set-matrix.outputs.has-reviews }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - id: set-matrix
        env:
          CONFIG_FILE: ${{ inputs.config_path }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ ! -f "$CONFIG_FILE" ]; then
            echo "config file not found: $CONFIG_FILE" >&2
            exit 1
          fi
          CHANGED_FILES_JSON=$(git diff --name-only "$BASE_SHA...$HEAD_SHA" \
            | jq -R -s 'split("\n") | map(select(length > 0))')
          # An agent matches when a changed file is included by diff_paths AND
          # not covered by its optional exclude_paths (so "general" can be
          # everything-except-app-dirs). Agents without exclude_paths behave
          # exactly as before.
          #
          # diff_paths / exclude_paths are matched as literal path PREFIXES, not
          # globs — "packages/" matches "packages/foo/bar.cairo". A repo-root
          # catch-all ("." or "./" or "") normalizes to the empty prefix, which
          # every path starts with; without that, "." would only match dotfiles
          # and a catch-all agent would silently skip README.md-only PRs.
          MATRIX_JSON=$(jq -c --argjson changed_files "$CHANGED_FILES_JSON" '
          def norm_prefix: if . == "." or . == "./" or . == "" then "" else . end;
          {
            include: [
              .agents[]
              | . as $a
              | (($a.diff_paths // []) | map(norm_prefix)) as $include_prefixes
              | (($a.exclude_paths // []) | map(norm_prefix)) as $exclude_prefixes
              | select(
                  [ $changed_files[]
                    | . as $f
                    | ($include_prefixes | any(. as $p | $f | startswith($p)))
                      and ($exclude_prefixes | any(. as $p | $f | startswith($p)) | not)
                  ] | any
                )
              | . + {
                  # "" is a valid prefix but not a valid git pathspec; "." is
                  # both, and means the same thing to git.
                  diff_paths_str: (.diff_paths | map(if . == "" then "." else . end) | join(" ")),
                  exclude_paths_str: ((.exclude_paths // []) | map(":!" + .) | join(" "))
                }
            ]
          }' "$CONFIG_FILE")
          HAS_REVIEWS=$(echo "$MATRIX_JSON" | jq -r 'if (.include | length) > 0 then "true" else "false" end')
          echo "matrix=$MATRIX_JSON" >> "$GITHUB_OUTPUT"
          echo "has-reviews=$HAS_REVIEWS" >> "$GITHUB_OUTPUT"

  claude-review:
    needs: changes
    # Skip on forks — secrets aren't available to fork PRs, so a review would
    # just fail/post empty. (Same-repo PRs and same-org branches run normally.)
    if: needs.changes.outputs.has-reviews == 'true' && inputs.enable_claude && github.event.pull_request.head.repo.fork == false
    name: Claude - ${{ matrix.agent_name }}
    runs-on: ubuntu-latest
    env:
      CLAUDE_REVIEW_MODEL: claude-opus-5-5
      CLAUDE_REVIEW_EFFORT: medium
    permissions:
      contents: read
      issues: write
      pull-requests: write
      id-token: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.changes.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Build review prompt
        id: build-prompt
        env:
          PROMPT_FILE: ${{ matrix.prompt_file }}
          DIFF_PATHS_STR: ${{ matrix.diff_paths_str }}
          EXCLUDE_PATHS_STR: ${{ matrix.exclude_paths_str }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
          AGENT_NAME: ${{ matrix.agent_name }}
          REVIEW_MODEL: ${{ env.CLAUDE_REVIEW_MODEL }}
          REVIEW_EFFORT: ${{ env.CLAUDE_REVIEW_EFFORT }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          COMMENT_HEADER="${REVIEW_MODEL}-${REVIEW_EFFORT} Code Review: [${HEAD_SHA:0:7}](${GITHUB_SERVER_URL}/${REPOSITORY}/commit/${HEAD_SHA})"
          git diff --name-only "$BASE_SHA...$HEAD_SHA" -- $DIFF_PATHS_STR $EXCLUDE_PATHS_STR > /tmp/scoped-files.txt
          {
            cat "$PROMPT_FILE"
            echo ""
            echo "---"
            echo ""
            echo "This is PR #$PR_NUMBER for $REPOSITORY."
            echo ""
            echo "Targeted reviewer: $AGENT_NAME"
            echo "Published comment title: $COMMENT_HEADER"
            echo "Review scope: $DIFF_PATHS_STR"
            echo ""
            echo "Allowed file list (all findings must reference these files):"
            sed 's/^/- /' /tmp/scoped-files.txt
            echo ""
            echo "Use this exact scoped diff command:"
            echo "  git diff $BASE_SHA...$HEAD_SHA -- $DIFF_PATHS_STR $EXCLUDE_PATHS_STR"
            echo ""
            echo "Pull request title: $PR_TITLE"
            echo "Pull request body:"
            echo "$PR_BODY"
            echo ""
            echo "---"
            echo ""
            cat <<'EOF'
          Hard scope rules:
          - Every finding must cite a file from the allowed file list above.
          - Do not inspect or mention files outside the allowed list.
          - If no actionable findings exist in scoped files, say exactly: lgtm

          Output requirements:
          - Do not write a heading/title; the workflow will add the comment title.
          - Keep findings strictly scoped to files in the allowed list.
          - Keep the comment concise: list only actionable findings, ordered by severity.
          - Do not include summaries, praise, or testing-gap notes unless tied to a specific finding.
          - Limit the review to the highest-signal findings.
          - Format each finding as:
            [SEVERITY] file_path:line_number - description
            Impact: what breaks and when
            Fix: concrete code change
          EOF
          } > /tmp/prompt.txt

          DELIM="PROMPT_EOF_$(date +%s)"
          {
            echo "prompt<<${DELIM}"
            cat /tmp/prompt.txt
            echo "${DELIM}"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Claude Code CLI
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install Claude Code CLI
        id: claude-cli
        run: |
          npm install --global @anthropic-ai/claude-code@2.1.281
          echo "path=$(command -v claude)" >> "$GITHUB_OUTPUT"

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1.0.231
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: ${{ steps.build-prompt.outputs.prompt }}
          claude_args: --model ${{ env.CLAUDE_REVIEW_MODEL }} --effort ${{ env.CLAUDE_REVIEW_EFFORT }}
          path_to_claude_code_executable: ${{ steps.claude-cli.outputs.path }}

      - name: Extract Claude review output
        if: always()
        env:
          EXECUTION_FILE: ${{ steps.claude-review.outputs.execution_file }}
        run: |
          OUTPUT_FILE=/tmp/review.txt
          if [ -n "$EXECUTION_FILE" ] && [ -f "$EXECUTION_FILE" ] && [ -s "$EXECUTION_FILE" ]; then
            jq -rs '
              def gather_text:
                if type == "string" then .
                elif type == "array" then (map(gather_text) | join("\n"))
                elif type == "object" then
                  if has("text") and (.text | type == "string") then .text
                  elif has("content") then (.content | gather_text)
                  elif has("message") then (.message | gather_text)
                  elif has("result") then (.result | gather_text)
                  elif has("summary") then (.summary | gather_text)
                  else "" end
                else "" end;
              [ .. | objects
                | select((.role? == "assistant") or (.type? == "assistant") or (.type? == "message") or (.type? == "result"))
                | gather_text ]
              | map(gsub("^\\s+|\\s+$"; "")) | map(select(length > 0)) | last // empty
            ' "$EXECUTION_FILE" > "$OUTPUT_FILE" || true
          fi
          if [ ! -s "$OUTPUT_FILE" ]; then
            echo "No review output was captured from Claude." > "$OUTPUT_FILE"
          fi

      - name: Post review comment
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REVIEW_MODEL: ${{ env.CLAUDE_REVIEW_MODEL }}
          REVIEW_EFFORT: ${{ env.CLAUDE_REVIEW_EFFORT }}
          REVIEW_OUTCOME: ${{ steps.claude-review.outcome }}
        run: |
          COMMENT_HEADER="${REVIEW_MODEL}-${REVIEW_EFFORT} Code Review: [${HEAD_SHA:0:7}](${GITHUB_SERVER_URL}/${REPO}/commit/${HEAD_SHA})"
          REVIEW_BODY_FILE=/tmp/review-body.txt
          if [ -s /tmp/review.txt ] && [ "$(head -n 1 /tmp/review.txt)" = "## $COMMENT_HEADER" ]; then
            sed '1d;/./,$!d' /tmp/review.txt > "$REVIEW_BODY_FILE"
          else
            cp /tmp/review.txt "$REVIEW_BODY_FILE"
          fi
          {
            echo "## $COMMENT_HEADER"
            echo ""
            if [ "$REVIEW_OUTCOME" != "success" ]; then
              echo "**Review execution failed**."
              echo ""
            fi
            cat "$REVIEW_BODY_FILE"
            echo ""
          } > /tmp/review-formatted.txt
          gh pr comment "$PR_NUMBER" --repo "$REPO" --body-file /tmp/review-formatted.txt > /dev/null

      # Opt-in merge gate. The review comment is posted by the step above
      # regardless, so a blocking finding still gets posted before the job
      # goes red. Runs on always() so it also fires when an earlier step
      # failed — a review that produced no output cannot match, so it will
      # not block.
      - name: Fail on blocking findings
        if: always() && inputs.block_on_severity
        run: |
          if [ -s /tmp/review.txt ] && grep -qE '\[(CRITICAL|HIGH)\]' /tmp/review.txt; then
            echo "::error::Review reported CRITICAL or HIGH severity findings"
            grep -nE '\[(CRITICAL|HIGH)\]' /tmp/review.txt
            exit 1
          fi
          echo "No blocking findings"

  codex-review:
    needs: changes
    # Skip on forks — secrets aren't available to fork PRs.
    if: needs.changes.outputs.has-reviews == 'true' && inputs.enable_codex && github.event.pull_request.head.repo.fork == false
    name: Codex - ${{ matrix.agent_name }}
    runs-on: ubuntu-latest
    env:
      CODEX_REVIEW_MODEL: gpt-6-luna
      CODEX_REVIEW_EFFORT: max
      CODEX_NPM_SPEC: "@openai/codex@0.155.0"
    permissions:
      contents: read
      issues: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.changes.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Enable Codex sandbox prerequisites
        run: |
          # Codex's bundled bubblewrap needs unprivileged user namespaces;
          # Ubuntu 24.04 runners block them via AppArmor. Same workaround as
          # openai/codex-action uses on GitHub-hosted runners.
          current_userns="$(sysctl -n kernel.unprivileged_userns_clone 2>/dev/null || true)"
          if [ -n "$current_userns" ] && [ "$current_userns" != "1" ]; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi
          current_apparmor="$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || true)"
          if [ -n "$current_apparmor" ] && [ "$current_apparmor" != "0" ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Verify Codex sandbox
        run: |
          # codex exec exits 0 even when its sandbox is broken, so prove the
          # sandbox can run a command before spending a review on it.
          npx -y "$CODEX_NPM_SPEC" sandbox -c 'sandbox_mode="read-only"' -- true

      - name: Inject OAuth Session
        env:
          CODEX_AUTH_DOT_JSON: ${{ secrets.CODEX_AUTH_DOT_JSON }}
        run: |
          mkdir -p ~/.codex
          printf '%s' "$CODEX_AUTH_DOT_JSON" > ~/.codex/auth.json
          chmod 600 ~/.codex/auth.json

      - name: Build review prompt
        env:
          PROMPT_FILE: ${{ matrix.prompt_file }}
          DIFF_PATHS_STR: ${{ matrix.diff_paths_str }}
          EXCLUDE_PATHS_STR: ${{ matrix.exclude_paths_str }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
          AGENT_NAME: ${{ matrix.agent_name }}
          REVIEW_MODEL: ${{ env.CODEX_REVIEW_MODEL }}
          REVIEW_EFFORT: ${{ env.CODEX_REVIEW_EFFORT }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          COMMENT_HEADER="${REVIEW_MODEL}-${REVIEW_EFFORT} Code Review: [${HEAD_SHA:0:7}](${GITHUB_SERVER_URL}/${REPOSITORY}/commit/${HEAD_SHA})"
          git diff --name-only "$BASE_SHA...$HEAD_SHA" -- $DIFF_PATHS_STR $EXCLUDE_PATHS_STR > /tmp/scoped-files.txt
          {
            cat "$PROMPT_FILE"
            echo ""
            echo "---"
            echo ""
            echo "This is PR #$PR_NUMBER for $REPOSITORY."
            echo ""
            echo "Targeted reviewer: $AGENT_NAME"
            echo "Published comment title: $COMMENT_HEADER"
            echo "Review scope: $DIFF_PATHS_STR"
            echo ""
            echo "Allowed file list (all findings must reference these files):"
            sed 's/^/- /' /tmp/scoped-files.txt
            echo ""
            echo "Use this exact scoped diff command:"
            echo "  git diff $BASE_SHA...$HEAD_SHA -- $DIFF_PATHS_STR $EXCLUDE_PATHS_STR"
            echo ""
            echo "Pull request title: $PR_TITLE"
            echo "Pull request body:"
            echo "$PR_BODY"
            echo ""
            echo "---"
            echo ""
            cat <<'EOF'
          Output requirements:
          - Do not write a heading/title; the workflow will add the comment title.
          - If no actionable findings exist, output exactly: lgtm
          - Otherwise, keep the comment concise: list only actionable findings, ordered by severity.
          - Do not include summaries, praise, or testing-gap notes unless tied to a specific finding.
          - Limit the review to the highest-signal findings.

          Format each finding as:
          [SEVERITY] file_path:line_number - description
          Impact: what breaks and when
          Fix: concrete code change

          Where SEVERITY is one of: CRITICAL, HIGH, MEDIUM, LOW, INFO
          EOF
          } > /tmp/prompt.txt

      - name: Run Codex review
        id: codex-review
        env:
          CODEX_REVIEW_TIMEOUT_SECONDS: ${{ vars.CODEX_REVIEW_TIMEOUT_SECONDS }}
        run: |
          set +e
          TIMEOUT_CMD=()
          if [ -n "${CODEX_REVIEW_TIMEOUT_SECONDS:-}" ]; then
            TIMEOUT_CMD=(timeout "$CODEX_REVIEW_TIMEOUT_SECONDS")
          fi
          "${TIMEOUT_CMD[@]}" npx -y "$CODEX_NPM_SPEC" exec \
            --sandbox read-only \
            -c "model=\"$CODEX_REVIEW_MODEL\"" \
            -c "model_reasoning_effort=\"$CODEX_REVIEW_EFFORT\"" \
            -o /tmp/review.txt \
            -- "$(cat /tmp/prompt.txt)" > /tmp/review-run.log 2>&1
          EXIT_CODE=$?
          set -e
          if [ "$EXIT_CODE" = "124" ] && [ -n "${CODEX_REVIEW_TIMEOUT_SECONDS:-}" ]; then
            echo "Codex CLI timed out after ${CODEX_REVIEW_TIMEOUT_SECONDS}s." >> /tmp/review-run.log
          fi
          if [ -s /tmp/review.txt ]; then cat /tmp/review.txt; fi
          if [ -s /tmp/review-run.log ]; then
            echo ""
            echo "Codex CLI log captured at /tmp/review-run.log."
            echo "Not printing the log because it can contain the review prompt."
          fi
          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"

      - name: Post review comment
        if: always() && steps.codex-review.outcome != 'skipped'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REVIEW_MODEL: ${{ env.CODEX_REVIEW_MODEL }}
          REVIEW_EFFORT: ${{ env.CODEX_REVIEW_EFFORT }}
          EXIT_CODE: ${{ steps.codex-review.outputs.exit_code }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          COMMENT_HEADER="${REVIEW_MODEL}-${REVIEW_EFFORT} Code Review: [${HEAD_SHA:0:7}](${GITHUB_SERVER_URL}/${REPO}/commit/${HEAD_SHA})"
          REVIEW_BODY_FILE=/tmp/review-body.txt
          if [ -s /tmp/review.txt ] && [ "$(head -n 1 /tmp/review.txt)" = "## $COMMENT_HEADER" ]; then
            sed '1d;/./,$!d' /tmp/review.txt > "$REVIEW_BODY_FILE"
          elif [ -s /tmp/review.txt ]; then
            cp /tmp/review.txt "$REVIEW_BODY_FILE"
          else
            : > "$REVIEW_BODY_FILE"
          fi
          {
            echo "## $COMMENT_HEADER"
            echo ""
            if [ "$EXIT_CODE" != "0" ]; then
              DISPLAY_EXIT_CODE="${EXIT_CODE:-unknown}"
              echo "**Review execution failed** (exit code $DISPLAY_EXIT_CODE)."
              echo ""
              echo "The Codex CLI log was not posted because it can contain the full review prompt."
              echo "See the workflow run for job status: $RUN_URL"
            elif [ -s "$REVIEW_BODY_FILE" ]; then
              cat "$REVIEW_BODY_FILE"
            else
              echo "No review output was produced."
            fi
            echo ""
          } > /tmp/review-formatted.txt
          gh pr comment "$PR_NUMBER" --repo "$REPO" --body-file /tmp/review-formatted.txt > /dev/null

      - name: Fail on Codex runtime error
        if: steps.codex-review.outputs.exit_code != '0'
        run: exit 1

      # Opt-in merge gate. The review comment is posted by the step above
      # regardless, so a blocking finding still gets posted before the job
      # goes red. Runs on always() so it also fires when an earlier step
      # failed — a review that produced no output cannot match, so it will
      # not block.
      - name: Fail on blocking findings
        if: always() && inputs.block_on_severity
        run: |
          if [ -s /tmp/review.txt ] && grep -qE '\[(CRITICAL|HIGH)\]' /tmp/review.txt; then
            echo "::error::Review reported CRITICAL or HIGH severity findings"
            grep -nE '\[(CRITICAL|HIGH)\]' /tmp/review.txt
            exit 1
          fi
          echo "No blocking findings"
